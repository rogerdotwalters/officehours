# Office Hours: one Worker serves the static client (Workers Static Assets)
# plus the game API (/api/rooms) and WebSocket endpoint (/ws).
name = "office-hours"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
# Requests that don't match a file fall through to the Worker (API + /ws).
not_found_handling = "none"

# Each room is one Durable Object instance, addressed by its room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[vars]
# Comma-separated origins allowed to call the API / open sockets from another
# domain (only needed if you host the client separately on Cloudflare Pages).
# Example: "https://office-hours.pages.dev"
ALLOWED_ORIGINS = ""

# Test rooms: tools to pick your role, spawn dummies, skip time and so on
# (server/dev/Sandbox.js). Only affects rooms created as test rooms.
#   "true"  : an "Open a test room" button for everyone (handy locally:
#             put ENABLE_SANDBOX=true in a .dev.vars file).
#   "false" : off, unless you set a secret test code with
#             `npx wrangler secret put SANDBOX_CODE`. Then a small "Testing?"
#             field on the menu opens a test room for whoever types the code.
ENABLE_SANDBOX = "false"
